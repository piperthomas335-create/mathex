<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>数学错题本 · GitHub Pages 静态镜像</title>
  <style>
    :root{color-scheme:light dark;--bg:#f7f5ef;--fg:#242533;--card:#fffdf8;--line:#dedbd2;--primary:#4657a8;--muted:#73737d;--accent:#d39b32}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans SC",sans-serif}
    .notice{padding:10px 5vw;background:var(--accent);color:#29200f;text-align:center;font-size:14px;font-weight:600}
    .wrap{max-width:1180px;margin:auto;padding:32px 24px}
    h1{font-family:serif;font-size:38px;margin:8px 0}
    .muted{color:var(--muted)}
    .stats,.grid{display:grid;gap:16px}
    .stats{grid-template-columns:repeat(4,1fr);margin:28px 0}
    .stat,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
    .num{font:32px serif;margin-top:8px}
    .grid{grid-template-columns:1fr 1.3fr}
    .tabs{display:flex;gap:8px;margin-bottom:16px}
    button,input{font:inherit;border:1px solid var(--line);border-radius:7px;padding:9px 12px;background:var(--card);color:var(--fg)}
    button{cursor:pointer}
    .active{background:var(--primary);color:white}
    input{width:100%;margin-bottom:12px}
    .item{padding:12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background 0.2s}
    .item:hover{background:color-mix(in srgb,var(--primary) 8%,transparent)}
    .tag{font-size:12px;color:var(--primary);font-weight:bold}
    .bar{height:5px;background:var(--line);border-radius:9px;margin-top:8px}
    .bar i{display:block;height:100%;background:var(--primary);border-radius:9px}
    @media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}h1{font-size:30px}}
    @media(prefers-color-scheme:dark){:root{--bg:#151621;--fg:#efeee8;--card:#1e202c;--line:#343643;--primary:#8d9ced;--muted:#a5a5ad;--accent:#d9a94c}}
  </style>
</head>
<body>
  <div class="notice">⚡ 中国大陆优化静态镜像 · 交互表单、Agent 上传与多学生管理请访问动态主站</div>
  <main class="wrap">
    <p class="tag">HIGH SCHOOL MATHEMATICS ATLAS</p>
    <h1>高中数学错题本</h1>
    <p class="muted">让每一次错误，长成知识结构的一部分。</p>

    <section class="stats">
      <div class="stat"><span class="muted">知识节点</span><div class="num">469</div></div>
      <div class="stat"><span class="muted">核心模块</span><div class="num">11</div></div>
      <div class="stat"><span class="muted">示例错题</span><div class="num">8</div></div>
      <div class="stat"><span class="muted">整体掌握度</span><div class="num">72%</div></div>
    </section>

    <div class="tabs">
      <button class="active" onclick="view('tree',this)">全量 11 模块知识树</button>
      <button onclick="view('errors',this)">全量错题</button>
    </div>

    <div class="grid">
      <section class="card">
        <input id="search" placeholder="在 11 模块与 469 节点中搜索…" oninput="render()">
        <div id="list"></div>
      </section>

      <article class="card" id="detail">
        <h2>GitHub Pages 静态镜像</h2>
        <p class="muted">从左侧选择一个模块或错题查看快照。支持中国大陆高速访问。</p>
      </article>
    </div>
  </main>
  <script src="mirror.js"></script>
</body>
</html>
